name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (root + fresh-path twin for cache-busting)
        run: |
          export NEXT_PUBLIC_BUILD="$(date -u +%y%m%d-%H%M) Pages"
          npm run build && cp -a out out-root
          NEXT_BASE=/halqati-app/v3 NEXT_PUBLIC_BUILD="$NEXT_PUBLIC_BUILD ·v3" npm run build && cp -a out out-v3
          rm -rf out && cp -a out-root out && cp -a out-v3 out/v3
      - name: Verify export
        run: |
          test -f out/index.html || { echo "out/index.html missing"; exit 1; }
          test -f out/v3/index.html || { echo "out/v3/index.html missing"; exit 1; }
          test -f out/.nojekyll || echo "warning: .nojekyll missing"
          grep -q "_next" out/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
