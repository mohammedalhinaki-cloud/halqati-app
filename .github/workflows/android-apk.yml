# Builds a debug APK on every push to main (or on demand) and uploads it as a
# downloadable build artifact.
#
# No Android Studio needed on your PC: open
#   https://github.com/<owner>/halqati-app/actions
# pick a run, download the "halqati-android-apk" artifact, unzip it, and
# install app-debug.apk on your phone (allow "install unknown apps").
name: Android APK (debug)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # The app is bundled at the ROOT base path (NEXT_BASE=''), because the
      # Capacitor WebView serves it from https://localhost/, not a sub-path.
      - name: Build web assets (root base for the native app)
        run: npm run build:android

      - name: Sync Capacitor Android (copies web assets + native plugins)
        run: npx cap sync android

      - name: Set up Android SDK (command-line tools)
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Write local.properties
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > android/local.properties

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: halqati-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
