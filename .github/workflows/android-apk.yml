# Builds a debug APK on every push to main (or on demand) and uploads it as a
# downloadable build artifact.
#
# No Android Studio needed on your PC: open
#   https://github.com/<owner>/halqati-app/actions
# pick a run, download the "halqati-android-apk" artifact, unzip it, and
# install app-debug.apk on your phone (allow "install unknown apps").
name: Android APK (debug)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # The app is bundled at the ROOT base path (NEXT_BASE=''), because the
      # Capacitor WebView serves it from https://localhost/, not a sub-path.
      - name: Build web assets (root base for the native app)
        run: npm run build:android

      - name: Sync Capacitor Android (copies web assets + native plugins)
        run: npx cap sync android

      - name: Install required SDK packages (uses the runner's preinstalled SDK)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager "$ANDROID_HOME"/bin/sdkmanager 2>/dev/null | head -1 || true)"
          if [ -z "$SDKM" ]; then
            # Fallback: install command-line tools from the official source
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/clt.zip
            (cd "$ANDROID_HOME/cmdline-tools" && unzip -q /tmp/clt.zip && mv cmdline-tools latest)
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Write local.properties
        run: echo "sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" > android/local.properties

      # AGP 8.13 requires JDK 17 — the runner's default JAVA_HOME is not
      # guaranteed to be 17, so pin it explicitly.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --console=plain --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: halqati-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
